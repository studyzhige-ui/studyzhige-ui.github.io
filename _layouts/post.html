<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="{{ page.description | default: page.excerpt | strip_html | truncate: 160 }}" />
  <meta name="theme-color" content="#eaf7ff" />
  <title>{{ page.title }} | 徵歌</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700;900&display=swap');
    :root{--sky:#eaf7ff;--land:#eff8ec;--card:rgba(255,255,255,.82);--text:#18352d;--muted:#5e766e;--green:#347c58;--blue:#458ad8;--line:rgba(52,124,88,.15);--shadow:0 18px 50px rgba(67,115,102,.11);--max:820px}
    *{box-sizing:border-box}body{margin:0;color:var(--text);font-family:"Inter","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.85;background:linear-gradient(180deg,var(--sky),var(--land));min-height:100vh}a{color:var(--green)}.wrap{width:min(calc(100% - 40px),var(--max));margin:auto}.nav{padding:22px 0 8px;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}.nav a{text-decoration:none}.article{margin:22px auto 54px;padding:clamp(26px,5vw,48px);background:var(--card);border:1px solid rgba(255,255,255,.86);border-radius:32px;box-shadow:var(--shadow)}.date{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:.06em}.article h1,.article h2,.article h3{font-family:"Noto Serif SC","Songti SC",serif;letter-spacing:-.03em}.article h1{font-size:clamp(38px,6vw,58px);line-height:1.12;margin:12px 0 12px}.description{font-size:18px;color:var(--muted);margin-bottom:28px}.content{font-size:17px}.content img{max-width:100%;border-radius:18px}.content pre{overflow:auto;padding:16px;border-radius:16px;background:#17332c;color:#eef8f2}.content code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.content blockquote{margin:24px 0;padding:4px 0 4px 18px;border-left:3px solid var(--green);color:var(--muted)}.content hr{border:0;border-top:1px solid var(--line);margin:34px 0}.back{display:inline-block;margin-top:30px;font-weight:700;text-decoration:none}footer{padding:0 0 54px;color:var(--muted);font-size:14px}
  </style>
</head>
<body>
  <div class="wrap"><nav class="nav"><a href="/">← 首页</a><a href="/blog.html">博客</a><a href="https://github.com/studyzhige-ui/studyzhige-ui.github.io/edit/main/{{ page.path }}" target="_blank" rel="noreferrer">编辑这篇文章 ↗</a></nav></div>
  <main class="wrap"><article class="article"><div class="date">{{ page.date | date: "%Y-%m-%d" }}</div><h1>{{ page.title }}</h1>{% if page.description %}<div class="description">{{ page.description }}</div>{% endif %}<div class="content">{{ content }}</div><a class="back" href="/blog.html">← 返回博客</a></article></main>
  <footer><div class="wrap">© 2026 徵歌</div></footer>
</body>
</html>
