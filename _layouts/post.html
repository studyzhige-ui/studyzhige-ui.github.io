<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="{{ page.description | default: page.excerpt | strip_html | truncate: 160 }}"><meta name="theme-color" content="#f4f6f1"><title>{{ page.title }} · 徵歌</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet"><style>
:root{--ink:#10231c;--muted:#68776f;--paper:#f4f6f1;--line:rgba(16,35,28,.15);--green:#295c45;--max:820px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,"Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}a{color:var(--green);text-underline-offset:4px}.wrap{width:min(calc(100% - 40px),var(--max));margin:auto}.nav{height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:12px}.nav a{text-decoration:none}.nav-right{display:flex;gap:20px}.head{padding:88px 0 54px}.date{font-size:11px;letter-spacing:.11em;color:var(--muted)}h1{font-size:clamp(44px,7vw,72px);line-height:1.08;letter-spacing:-.055em;margin:16px 0 18px;font-weight:600}.description{font-size:17px;line-height:1.75;color:var(--muted);max-width:680px}.content{padding:16px 0 90px;font-size:17px;line-height:1.95}.content h2,.content h3{margin:2.1em 0 .7em;letter-spacing:-.035em;line-height:1.3}.content h2{font-size:34px}.content h3{font-size:25px}.content p{margin:1.25em 0}.content img{max-width:100%;height:auto;margin:2.2em 0}.content blockquote{margin:2.2em 0;padding:0 0 0 24px;border-left:1px solid var(--green);font:500 22px/1.75 "Noto Serif SC",serif;color:#3f564c}.content code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em}.content pre{overflow:auto;padding:20px;background:#10231c;color:#eef5f1;font-size:14px;line-height:1.7}.content hr{border:0;border-top:1px solid var(--line);margin:3em 0}.content ul,.content ol{padding-left:1.4em}.back{display:inline-block;margin-top:44px;font-size:13px;text-decoration:none}footer{border-top:1px solid var(--line);padding:34px 0 50px;color:var(--muted);font-size:12px}@media(max-width:620px){.head{padding:62px 0 40px}.nav-right a:first-child{display:none}.content{font-size:16px}}
</style></head><body><div class="wrap"><nav class="nav"><a href="/">徵歌 · Zhige</a><div class="nav-right"><a href="https://github.com/studyzhige-ui/studyzhige-ui.github.io/edit/main/{{ page.path }}" target="_blank" rel="noreferrer">Edit ↗</a><a href="/blog.html">Blog</a></div></nav><header class="head"><div class="date">{{ page.date | date: "%Y · %m · %d" }}</div><h1>{{ page.title }}</h1>{% if page.description %}<div class="description">{{ page.description }}</div>{% endif %}</header><article class="content">{{ content }}<a class="back" href="/blog.html">← 返回博客</a></article></div><footer><div class="wrap">© 2026 徵歌</div></footer></body></html>
