<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f6f2" />
  <title>文章 · 徵歌</title>
  <style>
    :root{--ink:#17251f;--muted:#737c77;--line:#d9dedb;--paper:#f5f6f2;--max:760px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","SF Pro Text","Segoe UI","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}.wrap{width:min(calc(100% - 40px),var(--max));margin:auto}a{color:#315e4a;text-decoration:none}.top{padding:28px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;font-size:13px}.top-right{display:flex;gap:20px;color:var(--muted)}article{padding:84px 0 100px}.date{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(42px,7vw,68px);line-height:1.12;letter-spacing:-.035em;font-weight:610;margin:18px 0 20px}.desc{font-size:18px;line-height:1.7;color:#66706a;margin-bottom:52px}.content{font-size:17px;line-height:1.9}.content h2{font-size:31px;margin:58px 0 18px;line-height:1.3}.content h3{font-size:23px;margin:42px 0 14px}.content p{margin:0 0 24px}.content img{max-width:100%;margin:36px 0}.content blockquote{margin:38px 0;padding:0 0 0 22px;border-left:2px solid #53705f;color:#5e6963}.content pre{overflow:auto;background:#10201a;color:#e7eee9;padding:20px;margin:30px 0;font-size:14px;line-height:1.65}.content code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.content hr{border:0;border-top:1px solid var(--line);margin:48px 0}.error{padding:80px 0;color:var(--muted);font-size:16px}.error strong{display:block;font-size:30px;color:var(--ink);font-weight:580;margin-bottom:10px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="wrap top"><a href="index.html">徵歌 / ZHIGE</a><div class="top-right"><a href="blog.html">BLOG</a><a id="edit" href="#" target="_blank" rel="noreferrer">EDIT</a></div></div>
  <main class="wrap" id="main"><div class="error">正在读取文章…</div></main>
  <script>
    const params=new URLSearchParams(location.search),file=params.get('file'),repo='studyzhige-ui/studyzhige-ui.github.io',main=document.getElementById('main'),edit=document.getElementById('edit');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function parse(t){const m=t.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/),o={};if(!m)return{meta:o,body:t};m[1].split('\n').forEach(l=>{const i=l.indexOf(':');if(i>0)o[l.slice(0,i).trim()]=l.slice(i+1).trim().replace(/^['"]|['"]$/g,'')});return{meta:o,body:m[2]}}async function load(){if(!file||file.includes('/')||file.includes('..')||!file.endsWith('.md')){main.innerHTML='<div class="error"><strong>文章不存在。</strong><a href="blog.html">返回博客</a></div>';return}edit.href=`https://github.com/${repo}/edit/main/_posts/${encodeURIComponent(file)}`;try{const r=await fetch(`https://raw.githubusercontent.com/${repo}/main/_posts/${encodeURIComponent(file)}`);if(!r.ok)throw new Error();const {meta,body}=parse(await r.text()),date=file.slice(0,10),title=meta.title||file.replace(/^\d{4}-\d{2}-\d{2}-/,'').replace(/\.md$/,'').replace(/[-_]/g,' ');document.title=`${title} · 徵歌`;const html=window.marked?marked.parse(body):'<pre>'+esc(body)+'</pre>';main.innerHTML=`<article><div class="date">${date}</div><h1>${esc(title)}</h1>${meta.description?`<div class="desc">${esc(meta.description)}</div>`:''}<div class="content">${html}</div></article>`}catch(e){main.innerHTML='<div class="error"><strong>文章读取失败。</strong><a href="blog.html">返回博客</a></div>'}}load();
  </script>
</body>
</html>
