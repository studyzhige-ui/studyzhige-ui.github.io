<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="徵歌的个人博客。" />
  <meta name="theme-color" content="#f5f6f2" />
  <title>Blog · 徵歌</title>
  <style>
    :root{--ink:#14221c;--muted:#737d77;--line:#d9dedb;--paper:#f5f6f2;--max:980px}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","SF Pro Text","Segoe UI","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.wrap{width:min(calc(100% - 44px),var(--max));margin:auto}
    header{padding:30px 0 20px;border-bottom:1px solid var(--line)}.top{display:flex;justify-content:space-between;gap:20px;font-size:13px}.top nav{display:flex;gap:22px;color:var(--muted)}
    .hero{padding:96px 0 76px}.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}h1{font-size:clamp(64px,10vw,120px);line-height:.95;letter-spacing:-.055em;font-weight:610;margin:0}.intro{margin:26px 0 0;max-width:560px;color:#5e6862;font-size:16px;line-height:1.7}.actions{margin-top:28px;display:flex;gap:22px;font-size:13px}.actions a{border-bottom:1px solid currentColor;padding-bottom:4px}
    main{padding-bottom:100px}.list{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:140px 1fr 40px;gap:24px;align-items:center;padding:28px 0;border-bottom:1px solid var(--line);transition:opacity .2s}.row:hover{opacity:.58}.date{font-size:12px;color:var(--muted)}.title{font-size:clamp(22px,3vw,34px);font-weight:560;letter-spacing:-.02em}.arrow{text-align:right;font-size:22px}.empty{padding:38px 0;border-bottom:1px solid var(--line);color:var(--muted);font-size:15px;line-height:1.7}.empty strong{display:block;color:var(--ink);font-size:22px;font-weight:560;margin-bottom:8px}
    footer{padding:28px 0 46px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;color:var(--muted);font-size:12px}
    @media(max-width:680px){.hero{padding:72px 0 56px}.row{grid-template-columns:88px 1fr 18px;gap:14px}.top nav a:nth-child(2){display:none}}
  </style>
</head>
<body>
  <header><div class="wrap top"><a href="index.html">徵歌 / ZHIGE</a><nav><a href="index.html">HOME</a><a href="https://github.com/studyzhige-ui/studyzhige-ui.github.io/tree/main/_posts" target="_blank" rel="noreferrer">MANAGE</a><a href="https://github.com/studyzhige-ui" target="_blank" rel="noreferrer">GITHUB</a></nav></div></header>
  <section class="hero"><div class="wrap"><div class="kicker">Writing</div><h1>Blog</h1><p class="intro">只放真正写下来的东西。文章以 Markdown 保存在 GitHub，随时可以新增、修改或删除。</p><div class="actions"><a href="https://github.com/studyzhige-ui/studyzhige-ui.github.io/new/main/_posts" target="_blank" rel="noreferrer">写新文章 ↗</a><a href="https://github.com/studyzhige-ui/studyzhige-ui.github.io/tree/main/_posts" target="_blank" rel="noreferrer">管理文章 ↗</a></div></div></section>
  <main><div class="wrap"><div class="list" id="posts"><div class="empty">正在读取文章…</div></div></div></main>
  <footer class="wrap"><span>© 2026 徵歌</span><span>Markdown · GitHub Pages</span></footer>
  <script>
    const repo='studyzhige-ui/studyzhige-ui.github.io',box=document.getElementById('posts');function fm(t){const m=t.match(/^---\s*\n([\s\S]*?)\n---/),o={};if(!m)return o;m[1].split('\n').forEach(l=>{const i=l.indexOf(':');if(i>0)o[l.slice(0,i).trim()]=l.slice(i+1).trim().replace(/^['"]|['"]$/g,'')});return o}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const r=await fetch(`https://api.github.com/repos/${repo}/contents/_posts?ref=main`);if(!r.ok)throw new Error();const files=(await r.json()).filter(x=>x.type==='file'&&x.name.endsWith('.md')).sort((a,b)=>b.name.localeCompare(a.name));if(!files.length){box.innerHTML='<div class="empty"><strong>还没有文章。</strong>博客本身已经可以正常使用。第一篇文章什么时候出现，由你决定。</div>';return}const posts=await Promise.all(files.map(async f=>{const t=await fetch(f.download_url).then(x=>x.text());const m=fm(t);return{file:f.name,date:f.name.slice(0,10),title:m.title||f.name.replace(/^\d{4}-\d{2}-\d{2}-/,'').replace(/\.md$/,'').replace(/[-_]/g,' ')}}));box.innerHTML=posts.map(p=>`<a class="row" href="post.html?file=${encodeURIComponent(p.file)}"><span class="date">${p.date}</span><span class="title">${esc(p.title)}</span><span class="arrow">↗</span></a>`).join('')}catch(e){box.innerHTML='<div class="empty"><strong>文章列表暂时无法读取。</strong>页面本身没有问题；可以稍后刷新，或直接进入 GitHub 的 _posts 文件夹管理文章。</div>'}}load();
  </script>
</body>
</html>
